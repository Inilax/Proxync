name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions: read-all

env:
  PKG_DIR: packages/desktop

jobs:
  test-frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci
      
      - name: TypeScript type check 
        run: npm run typecheck --if-present
      
      - name: Lint 
        run: npm run lint --if-present

      - name: Test 
        run: npm test --if-present

  test-backend:
    name: Rust Backend Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: "${{ env.PKG_DIR }}/src-tauri -> target"
      
      # - name: Check formatting 
      #   run: |
      #     cd "${PKG_DIR}/src-tauri"
      #     cargo fmt --all -- --check

      # - name: Clippy 
      #   run: |
      #     cd "${PKG_DIR}/src-tauri"
      #     cargo clippy --all-targets --all-features -- -D warnings
      
      - name: Run Cargo Check
        run: |
          cd "${PKG_DIR}/src-tauri"
          cargo check 

      - name: Run Cargo Tests
        run: |
          cd "${PKG_DIR}/src-tauri"
          cargo test

  tauri: 
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    name: Tauri 
    runs-on: ubuntu-latest 
    needs: 
      - test-frontend 
      - test-backend 

    steps:
      - name: Checkout code 
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 
        
      - name: Setup Node.js 
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with: 
          node-version: 22 
          cache: npm 
      
      - name: Install dependencies 
        run: npm ci 
      
      - name: Setup Rust 
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
        
      - name: Install Tauri Linux dependencies 
        run: | 
          sudo apt-get update 
          sudo apt-get install -y \ 
            libwebkit2gtk-4.1-dev \ 
            build-essential \ 
            curl \ 
            wget \ 
            file \ 
            libxdo-dev \ 
            libssl-dev \ 
            libayatana-appindicator3-dev \ 
            librsvg2-dev 
        
      - name: Build Tauri application 
        run: |
          cd "${PKG_DIR}"
          npm run tauri build