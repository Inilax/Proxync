name: Fast CI

on:
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  PKG_DIR: packages/desktop

jobs:
  changes:
    name: Detect File Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'packages/desktop/src/**'
              - 'packages/desktop/public/**'
              - 'packages/desktop/index.html'
              - 'packages/desktop/vite.config.*'
              - 'packages/desktop/package.json'
              - 'packages/desktop/tsconfig*.json'
              - 'package.json'
              - 'package-lock.json'
            backend:
              - 'packages/core/**'
              - 'packages/cli/**'
              - 'packages/desktop/src-tauri/**'
              - 'packages/desktop/src-tauri/Cargo.*'

  test-frontend:
    name: Frontend Checks
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      # Fail-fast ordering: cheapest/fastest checks first
      - name: TypeScript type check
        working-directory: ${{ env.PKG_DIR }}
        run: npm run typecheck --if-present

      - name: Lint
        working-directory: ${{ env.PKG_DIR }}
        run: npm run lint --if-present

      - name: Unit Tests
        working-directory: ${{ env.PKG_DIR }}
        run: npm test --if-present

      - name: Production Build Check
        working-directory: ${{ env.PKG_DIR }}
        run: npm run build

  test-backend:
    name: Rust Backend Test
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-dev libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "${{ env.PKG_DIR }}/src-tauri -> target"

      # - name: Cargo Clippy
      #   working-directory: ${{ env.PKG_DIR }}/src-tauri
      #   run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Core Tests
        working-directory: packages/core
        run: cargo test

      - name: Run CLI Tests
        working-directory: packages/cli
        run: cargo test

      - name: Run Desktop Backend Tests
        working-directory: ${{ env.PKG_DIR }}/src-tauri
        run: cargo test
