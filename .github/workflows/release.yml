name: Release

# Fires whenever a release PR (opened by prepare-release.yml) is merged into main.
# Stage 1: Reads package version, tags the commit, creates permanent snapshot branch,
#          and extracts changelog release notes.
# Stage 2: Compiles and signs release artifacts across Windows, Linux, and macOS
#          in parallel using tauri-action, attaching installers and signatures to
#          the draft GitHub Release.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Declare default permissions as read only.
permissions: read-all

env:
  PKG_DIR: packages/desktop

jobs:
  prepare-tag:
    name: Prepare Tag & Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      exists: ${{ steps.tag.outputs.exists }}
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      body: ${{ steps.changelog.outputs.body }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Determine version & check if tag is new
        id: tag
        shell: bash
        run: |
          VERSION=$(node -p "require('./${PKG_DIR}/package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag and permanent release branch
        if: steps.tag.outputs.exists == 'false'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "${{ steps.tag.outputs.tag }}" -m "Release ${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

          # Permanent snapshot branch holding this release's code -- never
          # deleted, useful later for hotfixing this exact version without
          # branching off a newer main.
          git branch "release-${{ steps.tag.outputs.tag }}"
          git push origin "release-${{ steps.tag.outputs.tag }}"

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        if: steps.tag.outputs.exists == 'false'
        shell: bash
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const { execSync } = require('child_process');

          try {
            const currentContent = fs.readFileSync('CHANGELOG.md', 'utf8');
            let oldContent = '';
            
            try {
              oldContent = execSync('git show HEAD~1:CHANGELOG.md', { encoding: 'utf8', stdio: ['pipe', 'pipe', 'ignore'] });
              console.log("Read old CHANGELOG.md from HEAD~1");
            } catch (e) {
              console.log("Could not read CHANGELOG.md from HEAD~1. Trying previous tag...");
              try {
                const tags = execSync("git tag -l 'v*' --sort=-v:refname", { encoding: 'utf8' })
                  .split('\n')
                  .map(t => t.trim())
                  .filter(Boolean);
                const previousTag = tags[1];
                if (previousTag) {
                  oldContent = execSync(`git show ${previousTag}:CHANGELOG.md`, { encoding: 'utf8', stdio: ['pipe', 'pipe', 'ignore'] });
                  console.log(`Read old CHANGELOG.md from previous tag: ${previousTag}`);
                }
              } catch (tagErr) {
                console.log("Could not read CHANGELOG.md from previous tag:", tagErr.message);
              }
            }

            const currentLines = currentContent.split(/\r?\n/);
            let newNotes = [];

            if (oldContent) {
              const oldLines = oldContent.split(/\r?\n/);
              let oldFirstHeading = '';
              for (const line of oldLines) {
                if (line.trim().startsWith('## ')) {
                  oldFirstHeading = line.trim();
                  break;
                }
              }

              console.log(`Old first heading to match: "${oldFirstHeading}"`);

              let anchorIndex = -1;
              if (oldFirstHeading) {
                for (let i = 0; i < currentLines.length; i++) {
                  if (currentLines[i].trim() === oldFirstHeading) {
                    anchorIndex = i;
                    break;
                  }
                }
              }

              console.log(`Anchor index: ${anchorIndex}`);

              if (anchorIndex !== -1) {
                let started = false;
                for (let i = 0; i < anchorIndex; i++) {
                  const line = currentLines[i];
                  if (line.trim().startsWith('## ')) {
                    started = true;
                  }
                  if (started) {
                    newNotes.push(line);
                  }
                }
              }
            }

            if (newNotes.length === 0) {
              console.log("No new notes found via comparison. Using full CHANGELOG.md from first heading.");
              let started = false;
              for (const line of currentLines) {
                if (line.trim().startsWith('## ')) {
                  started = true;
                }
                if (started) {
                  newNotes.push(line);
                }
              }
            }

            const notesText = newNotes.join('\n').trim();
            console.log("Extracted Release Notes:\n", notesText);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `body<<EOF\n${notesText}\nEOF\n`);
          } catch (error) {
            console.error("Failed to extract release notes:", error);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `body<<EOF\nSee CHANGELOG.md for details.\nEOF\n`);
          }
          EOF

  build-tauri:
    name: Build & Sign (${{ matrix.platform }})
    needs: prepare-tag
    if: needs.prepare-tag.outputs.exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
        with:
          workspaces: "${{ env.PKG_DIR }}/src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app and publish GitHub Release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing — generated via `npx tauri signer generate`:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ${{ env.PKG_DIR }}
          tagName: ${{ needs.prepare-tag.outputs.tag }}
          releaseName: "Proxync ${{ needs.prepare-tag.outputs.tag }}"
          releaseBody: ${{ needs.prepare-tag.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
