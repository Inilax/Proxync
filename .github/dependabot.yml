version: 2
updates:
  # Maintain dependencies for GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "cron"
      cronjob: "0 6 */3 * *"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"

  # Maintain dependencies for desktop npm workspace
  - package-ecosystem: "npm"
    directory: "/packages/desktop"
    target-branch: "develop"
    schedule:
      interval: "cron"
      cronjob: "0 6 */3 * *"
    open-pull-requests-limit: 3
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # Maintain dependencies for Rust Tauri backend
  - package-ecosystem: "cargo"
    directory: "/packages/desktop/src-tauri"
    target-branch: "develop"
    schedule:
      interval: "cron"
      cronjob: "0 6 */3 * *"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      cargo-dependencies:
        patterns:
          - "*"

