[package]
name = "proxync-core"
version = "0.2.5"
edition = "2021"
description = "Shared core library for Proxync tunneling, proxy, and reconnaissance"
authors = ["Inilax"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "gzip", "deflate", "brotli"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
lazy_static = "1.5"
base64 = "0.23"
os_info = "3.15"
sha2 = "0.10"
hex = "0.4"
minisign-verify = "0.3"
subtle = "2.6"

[dev-dependencies]
tempfile = "3"
